# Deploys the PWA + API to Cloudflare Workers (D1 + Workers Assets).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Account Settings: Read).
# Optional: CLOUDFLARE_ACCOUNT_ID if the token can see more than one account.
# Optional: ANTHROPIC_API_KEY turns on recipe generation for dishes that are not saved yet
#           (it is copied onto the Worker as a secret on every deploy).
name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/cool-heisenberg-kddg9q]
    paths-ignore: ['docs/**', 'reports/**', '*.md']
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @foodify/web build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          packageManager: pnpm
          command: deploy
      - name: Set the recipe-generation key on the Worker
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | pnpm exec wrangler secret put ANTHROPIC_API_KEY
      - name: Smoke test the deployed Worker
        run: |
          URL=https://foodify.jeff-cousens.workers.dev
          # A fresh upload can take a few seconds to reach every edge: wait until the health check reports the
          # seed version this build carries, which also runs the database top-up for existing deployments.
          want=$(grep -o 'SEED_VERSION = [0-9]*' packages/app/src/seed.ts | grep -o '[0-9]*$')
          for i in $(seq 1 30); do
            body=$(curl -sS "$URL/api/health" || true)
            echo "$body" | grep -q "\"seedVersion\":$want" && break
            echo "waiting for rollout: $body"; sleep 3
          done
          echo "$body" | grep -q "\"seedVersion\":$want" || { echo "new version not live after 90s"; exit 1; }
          echo "GET $URL/api/health"; curl -sS -w '\nHTTP %{http_code}\n' "$URL/api/health"
          echo "GET $URL/ (expect 401: the app is behind HTTP Basic auth)"; curl -sS -o /dev/null -w '%{http_code}\n' "$URL/"
          echo "GET $URL/api/state (expect 401)"; curl -sS -o /dev/null -w '%{http_code}\n' "$URL/api/state"
          echo "GET $URL/api/state with a wrong password (expect 401)"; curl -sS -o /dev/null -w '%{http_code}\n' -u admin:wrong "$URL/api/state"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/health")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/")" = 401
